# Builds the project with Maven, which regenerates the database under src/main/resources and fails
# when the committed one is stale, and keeps the jar, which carries the database, as a workflow artifact.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main", "sketch" ]
  pull_request:
    branches: [ "develop", "main", "sketch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The test sources, which are the generator, are compiled with --release 25
    # (maven.compiler.testRelease); keep this in step with the enforcer's requireJavaVersion
    # bound in pom.xml.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # `verify` runs everything bound up to and including verify: the enforcer, the tests, which
    # check the .asv inputs and then generate and check the database, jacoco and the licence check.
    - name: Verify with Maven
      run: mvn -B verify --file pom.xml
    # The jar holds the database and nothing else; this is how a run's output can be downloaded.
    - name: Upload the jar
      uses: actions/upload-artifact@v4
      with:
        name: heads-of-governments-db
        path: target/heads-of-governments-db-*.jar
        if-no-files-found: error
    # Optional: uploads the full dependency graph to GitHub to improve the quality of Dependabot
    # alerts this repository can receive.
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4
